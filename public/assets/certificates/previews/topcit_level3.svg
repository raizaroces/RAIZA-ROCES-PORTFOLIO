<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="topcitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#topcitBg)"/>
  <rect x="35" y="35" width="1130" height="730" fill="none" stroke="#2563eb" stroke-width="2" rx="14" opacity="0.5"/>
  <rect x="45" y="45" width="1110" height="710" fill="none" stroke="#38bdf8" stroke-width="1" rx="10" opacity="0.2"/>
  
  <!-- Header -->
  <text x="100" y="110" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="800" fill="#38bdf8" letter-spacing="3">TOPCIT</text>
  <text x="100" y="135" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Test of Practical Competency in ICT • Jointly Administered by IITP</text>
  <text x="1100" y="115" text-anchor="end" font-family="monospace" font-size="15" fill="#94a3b8">TL2506004034</text>
  
  <!-- Certificate Banner -->
  <rect x="100" y="170" width="1000" height="45" fill="rgba(37, 99, 235, 0.2)" rx="8"/>
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#60a5fa" letter-spacing="4">OFFICIAL COMPETENCY CERTIFICATE</text>
  
  <!-- Candidate Info -->
  <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">CANDIDATE NAME</text>
  <text x="600" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff">RAIZA ROCES</text>
  
  <!-- Badges Grid -->
  <g transform="translate(250, 375)">
    <rect width="320" height="90" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(56, 189, 248, 0.4)" rx="10"/>
    <text x="160" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">ACHIEVED PROFICIENCY</text>
    <text x="160" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">LEVEL 3</text>
  </g>
  <g transform="translate(630, 375)">
    <rect width="320" height="90" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(99, 102, 241, 0.4)" rx="10"/>
    <text x="160" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">OFFICIAL TEST SCORE</text>
    <text x="160" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="#818cf8">649 / 1,000</text>
  </g>
  
  <!-- High Competency Modules -->
  <g transform="translate(100, 505)">
    <rect width="1000" height="135" fill="rgba(15, 23, 42, 0.5)" stroke="rgba(255, 255, 255, 0.08)" rx="10"/>
    <text x="30" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">KEY HIGH-PERCENTILE DOMAINS</text>
    
    <text x="30" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">• Data Management: <tspan fill="#34d399">89.0% (129/145)</tspan></text>
    <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">• System Architecture: <tspan fill="#34d399">86.7% (65/75)</tspan></text>
    
    <text x="500" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">• Information Security: <tspan fill="#34d399">82.4% (70/85)</tspan></text>
    <text x="500" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">• Technical IT Business &amp; Ethics: <tspan fill="#34d399">68.4% (65/95)</tspan></text>
  </g>
  
  <!-- Footer -->
  <text x="100" y="685" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b">Test Date: December 10, 2025 | Verification: www.topcit.or.kr</text>
  <text x="1100" y="685" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b">Institute for Information &amp; Communications Technology Promotion (IITP)</text>
</svg>