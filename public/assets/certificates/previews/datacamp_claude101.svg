<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05192d"/>
      <stop offset="100%" stop-color="#0b2b4f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05e35e"/>
      <stop offset="100%" stop-color="#03ef62"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#05e35e" stroke-width="2" rx="16" opacity="0.4"/>
  <rect x="50" y="50" width="1100" height="700" fill="none" stroke="#ffffff" stroke-width="1" rx="12" opacity="0.1"/>
  
  <!-- DataCamp Badge / Logo Header -->
  <g transform="translate(100, 110)">
    <circle cx="28" cy="28" r="28" fill="#05e35e" opacity="0.15"/>
    <path d="M18 16 L38 28 L18 40 Z" fill="#05e35e"/>
    <text x="70" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="2">datacamp</text>
  </g>
  <text x="1100" y="145" text-anchor="end" font-family="monospace" font-size="16" fill="#798b9f">#50,439,826</text>
  
  <!-- Certificate Text -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#798b9f" letter-spacing="6">STATEMENT OF ACCOMPLISHMENT</text>
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#05e35e" letter-spacing="4">HAS BEEN AWARDED TO</text>
  
  <!-- Name -->
  <text x="600" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="1">RAIZA ROCES</text>
  <line x1="350" y1="390" x2="850" y2="390" stroke="#05e35e" stroke-width="3" stroke-linecap="round"/>
  
  <text x="600" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#798b9f" letter-spacing="4">FOR SUCCESSFULLY COMPLETING</text>
  <text x="600" y="505" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Claude 101</text>
  
  <!-- Footer Info -->
  <g transform="translate(180, 620)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#798b9f" letter-spacing="2">LENGTH</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2 HRS</text>
  </g>
  <g transform="translate(600, 620)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#798b9f" letter-spacing="2">COMPLETED ON</text>
    <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">OCTOBER 30, 2026</text>
  </g>
  <g transform="translate(1020, 620)">
    <text x="0" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#798b9f" letter-spacing="2">ISSUED BY</text>
    <text x="0" y="24" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Jonathan Cornelissen, CEO</text>
  </g>
</svg>